name: validate

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  skills:
    name: Validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the reference validator
        run: pip install skills-ref==0.1.1
      - name: Validate against the specification
        run: |
          shopt -s nullglob
          for skill in skills/*/; do
            agentskills validate "$skill"
          done
